name: college_bus
description: College Bus tracking app - Carmel Polytechnic College, Punnapra
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  geolocator: ^14.1.2
  url_launcher: ^6.3.0
  http: ^1.2.2
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  android_intent_plus: ^6.1.0
  pdf: ^3.11.1
  image_picker: ^1.1.2
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/bus_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
